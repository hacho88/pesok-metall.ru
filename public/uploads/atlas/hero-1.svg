<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="metalPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1440" height="500" fill="url(#bg1)"/>
  <rect width="1440" height="500" fill="url(#metalPattern)"/>
  <rect width="1440" height="500" fill="url(#glow1)"/>
  <!-- Steel pipes stack -->
  <g opacity="0.7">
    <ellipse cx="1150" cy="380" rx="80" ry="25" fill="#374151"/>
    <rect x="1070" y="340" width="160" height="50" rx="25" fill="#4B5563" stroke="#6B7280" stroke-width="2"/>
    <rect x="1080" y="345" width="140" height="40" rx="20" fill="#374151"/>
    <ellipse cx="1150" cy="365" rx="65" ry="18" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
    <ellipse cx="1150" cy="365" rx="55" ry="14" fill="#111827"/>

    <ellipse cx="1050" cy="420" rx="70" ry="22" fill="#374151"/>
    <rect x="980" y="385" width="140" height="45" rx="22" fill="#4B5563" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="1050" cy="407" rx="58" ry="16" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
    <ellipse cx="1050" cy="407" rx="48" ry="12" fill="#111827"/>

    <ellipse cx="1250" cy="410" rx="65" ry="20" fill="#374151"/>
    <rect x="1185" y="378" width="130" height="42" rx="21" fill="#4B5563" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="1250" cy="399" rx="53" ry="15" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
    <ellipse cx="1250" cy="399" rx="44" ry="11" fill="#111827"/>
  </g>
  <!-- Rebar bundles -->
  <g opacity="0.5" stroke="#F97316" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="460" x2="350" y2="460"/>
    <line x1="100" y1="445" x2="350" y2="445"/>
    <line x1="100" y1="470" x2="350" y2="470"/>
    <line x1="100" y1="430" x2="350" y2="430"/>
  </g>
  <g opacity="0.3" stroke="#6B7280" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="490" x2="370" y2="490"/>
    <line x1="80" y1="475" x2="370" y2="475"/>
  </g>
  <!-- Orange accent bar -->
  <rect x="0" y="495" width="1440" height="5" fill="#F97316"/>
</svg>
